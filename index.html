<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog BB — Posts, Editorias &amp; Categorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2247; --navy-2:#16305F;
  --gold:#C9971F; --gold-soft:#E8CE8F;
  --paper:#FAF7EF; --paper-2:#F1ECDD;
  --ink:#1C1B18; --ink-soft:#5B584E; --line:#DFD8C4;
  --publish:#2F6B3F; --publish-bg:#E4EEE1;
  --draft:#8A6A1D; --draft-bg:#F3E9D2;
  --bar1:#16305F; --bar2:#C9971F;
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B1730; --navy-2:#14264A; --gold:#D9AE49; --gold-soft:#6B551E;
    --paper:#14120E; --paper-2:#1C1913; --ink:#EDE7D8; --ink-soft:#B4AC98; --line:#38321F;
    --publish:#8FD1A0; --publish-bg:#1D3323; --draft:#E3C371; --draft-bg:#3A2E12;
    --bar1:#3F5A94; --bar2:#D9AE49;
  }
}
:root[data-theme="dark"]{
  --navy:#0B1730; --navy-2:#14264A; --gold:#D9AE49; --gold-soft:#6B551E;
  --paper:#14120E; --paper-2:#1C1913; --ink:#EDE7D8; --ink-soft:#B4AC98; --line:#38321F;
  --publish:#8FD1A0; --publish-bg:#1D3323; --draft:#E3C371; --draft-bg:#3A2E12;
  --bar1:#3F5A94; --bar2:#D9AE49;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--ink);}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0;}

.topbar{background:var(--navy);color:var(--paper);padding:20px 28px 18px;border-bottom:3px solid var(--gold);}
.topbar-inner{max-width:1480px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:14px;}
.brand h1{font-size:21px;color:var(--paper);}
.brand span.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold-soft);border:1px solid rgba(201,151,31,0.5);padding:2px 7px;border-radius:2px;}
.kpis{display:flex;gap:24px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;}
.kpi{text-align:right;}
.kpi b{display:block;font-size:19px;color:var(--gold);line-height:1.1;}
.kpi small{color:#B9C2D6;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;}

.wrap{max-width:1480px;margin:0 auto;padding:22px 28px 60px;}

/* analysis panel */
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
@media (max-width:880px){.analysis{grid-template-columns:1fr;}}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:16px 18px;}
.panel h2{font-size:14px;margin-bottom:12px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px;cursor:pointer;}
.bar-label{width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.bar-track{flex:1;background:var(--paper-2);border-radius:2px;height:15px;overflow:hidden;}
.bar-fill{height:100%;background:var(--bar1);border-radius:2px;transition:width .2s;}
.bar-fill.cat{background:var(--bar2);}
.bar-count{width:34px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11.5px;}
.bar-row.active .bar-label{font-weight:700;color:var(--navy-2);}
:root[data-theme="dark"] .bar-row.active .bar-label{color:var(--gold);}

/* layout with sidebar */
.layout{display:grid;grid-template-columns:270px 1fr;gap:0;align-items:start;}
@media (max-width:880px){.layout{grid-template-columns:1fr;}}
.sidebar{padding-right:22px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;}
@media (max-width:880px){.sidebar{position:static;max-height:none;padding-right:0;margin-bottom:20px;}}
.side-block{margin-bottom:20px;}
.side-block h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.search-box{width:100%;padding:9px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);color:var(--ink);font-family:'Inter',sans-serif;}
.search-box:focus{outline:2px solid var(--gold);outline-offset:1px;}
.status-row,.filter-row{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;}
.opt{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border-radius:var(--radius);font-size:12.8px;}
.opt:hover{background:var(--paper-2);}
.opt input{accent-color:var(--gold);flex-shrink:0;}
.opt .oname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.opt .ocount{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.publish{background:var(--publish);} .dot.draft{background:var(--draft);}
.clear-link{font-size:11px;color:var(--navy-2);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-weight:400;}
:root[data-theme="dark"] .clear-link{color:var(--gold);}
.sort-select{width:100%;padding:8px 9px;font-size:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);color:var(--ink);font-family:'Inter',sans-serif;}

.main-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
.result-count{font-size:13px;color:var(--ink-soft);}
.result-count b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
.active-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:5px;background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px 3px 11px;font-size:12px;}
.chip.chip-e{border-color:var(--gold);}
.chip.chip-c{border-color:var(--navy-2);}
.chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px;}
.chip button:hover{color:#99372B;}

.table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper);}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);background:var(--paper-2);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{color:var(--ink);}
thead th.sorted::after{content:" \2193";color:var(--gold);}
thead th.sorted.asc::after{content:" \2191";}
tbody tr{border-bottom:1px solid var(--line);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--paper-2);}
td{padding:10px 12px;vertical-align:top;}
td.title-cell{width:32%;}
.post-title{font-weight:500;color:var(--ink);}
.chiprow{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;}
.tag-pill{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:2px;padding:1px 5px;}
.tag-pill.ed{color:var(--navy-2);border-color:var(--gold-soft);background:#FBF3DE;}
:root[data-theme="dark"] .tag-pill.ed{color:var(--gold);background:#241E0C;}
td.date-cell{white-space:nowrap;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.status-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.status-badge.publish{color:var(--publish);background:var(--publish-bg);}
.status-badge.draft{color:var(--draft);background:var(--draft-bg);}
.empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--ink);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Blog do Banco do Brasil</h1>
      <span class="tag">posts · editorias · categorias</span>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>

<div class="wrap">

  <div class="analysis">
    <div class="panel">
      <h2>Posts por editoria</h2>
      <div id="edChart"></div>
    </div>
    <div class="panel">
      <h2>Posts por categoria (top 12)</h2>
      <div id="catChart"></div>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">

      <div class="side-block">
        <h3>Busca</h3>
        <input type="text" class="search-box" id="searchBox" placeholder="Título do post...">
      </div>

      <div class="side-block">
        <h3>Status</h3>
        <div class="status-row" id="statusRow"></div>
      </div>

      <div class="side-block">
        <h3>Ordenar</h3>
        <select class="sort-select" id="sortSelect">
          <option value="date_desc">Data (mais recente)</option>
          <option value="date_asc">Data (mais antiga)</option>
          <option value="title_asc">Título (A–Z)</option>
          <option value="title_desc">Título (Z–A)</option>
        </select>
      </div>

      <div class="side-block">
        <h3>Editoria <button class="clear-link" id="clearEd">limpar</button></h3>
        <div class="filter-row" id="edList"></div>
      </div>

      <div class="side-block">
        <h3>Categoria <button class="clear-link" id="clearCat">limpar</button></h3>
        <div class="filter-row" id="catList"></div>
      </div>

    </aside>

    <main>
      <div class="main-head">
        <div class="result-count" id="resultCount"></div>
        <div class="active-chips" id="activeChips"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="title">Post</th>
              <th data-sort="date" style="width:100px;">Data</th>
              <th data-sort="status" style="width:110px;">Status</th>
              <th style="width:220px;">Editorias</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">
          <h3>Nenhum post encontrado</h3>
          <div>Ajuste os filtros ou limpe a busca.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const POSTS = JSON.parse(document.getElementById('post-data').textContent);
const SEM_EDITORIA = 'Sem editoria associada';
const STATUS_LABEL = { publish: 'Publicado', draft: 'Rascunho' };
const STATUS_ORDER = ['publish','draft'];

// normalize: posts with no editoria get the SEM_EDITORIA pseudo-tag for filtering/counting
POSTS.forEach(p => { p.eAll = p.e.length ? p.e : [SEM_EDITORIA]; });

const edCounts = {};
POSTS.forEach(p => p.eAll.forEach(e => { edCounts[e] = (edCounts[e]||0)+1; }));
const sortedEds = Object.keys(edCounts).sort((a,b)=> {
  if (a === SEM_EDITORIA) return 1;
  if (b === SEM_EDITORIA) return -1;
  return edCounts[b]-edCounts[a] || a.localeCompare(b,'pt-BR');
});

const catCounts = {};
POSTS.forEach(p => p.c.forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }));
const sortedCats = Object.keys(catCounts).sort((a,b)=> catCounts[b]-catCounts[a] || a.localeCompare(b,'pt-BR'));

const statusCounts = {};
POSTS.forEach(p => { statusCounts[p.s] = (statusCounts[p.s]||0)+1; });

const state = {
  search: '',
  statuses: new Set(STATUS_ORDER.filter(s=>statusCounts[s])),
  eds: new Set(),
  cats: new Set(),
  sort: 'date_desc',
};

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---- status checkboxes ----
const statusRow = document.getElementById('statusRow');
STATUS_ORDER.filter(s=>statusCounts[s]).forEach(s=>{
  const l = document.createElement('label');
  l.className = 'opt';
  l.innerHTML = `<input type="checkbox" checked data-status="${s}"><span class="dot ${s}"></span><span class="oname">${STATUS_LABEL[s]}</span><span class="ocount">${statusCounts[s]}</span>`;
  statusRow.appendChild(l);
});
statusRow.addEventListener('change', e=>{
  const cb = e.target;
  if (cb.dataset.status){
    cb.checked ? state.statuses.add(cb.dataset.status) : state.statuses.delete(cb.dataset.status);
    render();
  }
});

// ---- editoria list ----
const edListEl = document.getElementById('edList');
function renderEdList(){
  edListEl.innerHTML = '';
  sortedEds.forEach(e=>{
    const l = document.createElement('label');
    l.className = 'opt';
    const checked = state.eds.has(e) ? 'checked' : '';
    l.innerHTML = `<input type="checkbox" ${checked} data-ed="${escapeHtml(e)}"><span class="oname" title="${escapeHtml(e)}">${escapeHtml(e)}</span><span class="ocount">${edCounts[e]}</span>`;
    edListEl.appendChild(l);
  });
}
renderEdList();
edListEl.addEventListener('change', e=>{
  const cb = e.target;
  if (cb.dataset.ed){
    cb.checked ? state.eds.add(cb.dataset.ed) : state.eds.delete(cb.dataset.ed);
    render();
  }
});
document.getElementById('clearEd').addEventListener('click', ()=>{ state.eds.clear(); renderEdList(); render(); });

// ---- categoria list ----
const catListEl = document.getElementById('catList');
function renderCatList(){
  catListEl.innerHTML = '';
  sortedCats.forEach(c=>{
    const l = document.createElement('label');
    l.className = 'opt';
    const checked = state.cats.has(c) ? 'checked' : '';
    l.innerHTML = `<input type="checkbox" ${checked} data-cat="${escapeHtml(c)}"><span class="oname" title="${escapeHtml(c)}">${escapeHtml(c)}</span><span class="ocount">${catCounts[c]}</span>`;
    catListEl.appendChild(l);
  });
}
renderCatList();
catListEl.addEventListener('change', e=>{
  const cb = e.target;
  if (cb.dataset.cat){
    cb.checked ? state.cats.add(cb.dataset.cat) : state.cats.delete(cb.dataset.cat);
    render();
  }
});
document.getElementById('clearCat').addEventListener('click', ()=>{ state.cats.clear(); renderCatList(); render(); });

// ---- search / sort ----
document.getElementById('searchBox').addEventListener('input', e=>{ state.search = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });

let headerSort = { key:'date', dir:'desc' };
document.querySelectorAll('thead th[data-sort]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.sort;
    if (headerSort.key === key) headerSort.dir = headerSort.dir==='asc'?'desc':'asc';
    else headerSort = { key, dir: key==='title' ? 'asc' : 'desc' };
    state.sort = `${key}_${headerSort.dir}`;
    const sel = document.getElementById('sortSelect');
    sel.value = ['date_desc','date_asc','title_asc','title_desc'].includes(state.sort) ? state.sort : 'date_desc';
    render();
  });
});

// ---- analysis bar charts (click to filter) ----
function renderCharts(){
  const edMax = Math.max(...sortedEds.map(e=>edCounts[e]));
  const edChart = document.getElementById('edChart');
  edChart.innerHTML = sortedEds.map(e=>{
    const active = state.eds.has(e) ? 'active' : '';
    const pct = Math.round(edCounts[e]/edMax*100);
    return `<div class="bar-row ${active}" data-ed="${escapeHtml(e)}">
      <div class="bar-label">${escapeHtml(e)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-count">${edCounts[e]}</div>
    </div>`;
  }).join('');
  edChart.querySelectorAll('.bar-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const e = row.dataset.ed;
      state.eds.has(e) ? state.eds.delete(e) : state.eds.add(e);
      renderEdList();
      render();
    });
  });

  const top = sortedCats.slice(0,12);
  const catMax = Math.max(...top.map(c=>catCounts[c]));
  const catChart = document.getElementById('catChart');
  catChart.innerHTML = top.map(c=>{
    const active = state.cats.has(c) ? 'active' : '';
    const pct = Math.round(catCounts[c]/catMax*100);
    return `<div class="bar-row ${active}" data-cat="${escapeHtml(c)}">
      <div class="bar-label">${escapeHtml(c)}</div>
      <div class="bar-track"><div class="bar-fill cat" style="width:${pct}%"></div></div>
      <div class="bar-count">${catCounts[c]}</div>
    </div>`;
  }).join('');
  catChart.querySelectorAll('.bar-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const c = row.dataset.cat;
      state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
      renderCatList();
      render();
    });
  });
}

function applyFilters(){
  let list = POSTS.filter(p=> state.statuses.has(p.s));
  if (state.eds.size) list = list.filter(p=> p.eAll.some(e=>state.eds.has(e)));
  if (state.cats.size) list = list.filter(p=> p.c.some(c=>state.cats.has(c)));
  if (state.search) list = list.filter(p=> p.t.toLowerCase().includes(state.search));
  return list;
}

function applySort(list){
  const [key,dir] = state.sort.split(/_(?=asc|desc)/);
  const mult = dir==='asc' ? 1 : -1;
  return [...list].sort((a,b)=>{
    let av,bv;
    switch(key){
      case 'title': av=a.t.toLowerCase(); bv=b.t.toLowerCase(); break;
      case 'status': av=a.s; bv=b.s; break;
      case 'date': default: av=a.d||''; bv=b.d||''; break;
    }
    if (av<bv) return -1*mult;
    if (av>bv) return 1*mult;
    return 0;
  });
}

function renderChips(){
  const wrap = document.getElementById('activeChips');
  wrap.innerHTML = '';
  state.eds.forEach(e=>{
    const chip = document.createElement('div');
    chip.className = 'chip chip-e';
    chip.innerHTML = `<span>${escapeHtml(e)}</span><button aria-label="remover">×</button>`;
    chip.querySelector('button').addEventListener('click', ()=>{ state.eds.delete(e); renderEdList(); render(); });
    wrap.appendChild(chip);
  });
  state.cats.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip chip-c';
    chip.innerHTML = `<span>${escapeHtml(c)}</span><button aria-label="remover">×</button>`;
    chip.querySelector('button').addEventListener('click', ()=>{ state.cats.delete(c); renderCatList(); render(); });
    wrap.appendChild(chip);
  });
}

function renderTable(list){
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');
  if (!list.length){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  tbody.innerHTML = list.map(p=>{
    const catsHtml = p.c.length ? `<div class="chiprow">${p.c.map(c=>`<span class="tag-pill">${escapeHtml(c)}</span>`).join('')}</div>` : '';
    const edsHtml = p.eAll.map(e=>`<span class="tag-pill ed">${escapeHtml(e)}</span>`).join(' ');
    return `<tr>
      <td class="title-cell"><div class="post-title">${escapeHtml(p.t)}</div>${catsHtml}</td>
      <td class="date-cell">${p.dfmt}</td>
      <td><span class="status-badge ${p.s}">${STATUS_LABEL[p.s]||p.s}</span></td>
      <td>${edsHtml}</td>
    </tr>`;
  }).join('');
}

function renderKpis(filteredCount){
  const semEd = POSTS.filter(p=>!p.e.length).length;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><b>${POSTS.length}</b><small>total de posts</small></div>
    <div class="kpi"><b>${sortedEds.length - (edCounts[SEM_EDITORIA]?1:0)}</b><small>editorias</small></div>
    <div class="kpi"><b>${semEd}</b><small>sem editoria</small></div>
    <div class="kpi"><b>${filteredCount}</b><small>visíveis</small></div>
  `;
}

function render(){
  const filtered = applyFilters();
  const sorted = applySort(filtered);
  renderTable(sorted);
  renderChips();
  renderKpis(filtered.length);
  renderCharts();
  document.getElementById('resultCount').innerHTML = `<b>${filtered.length}</b> de ${POSTS.length} posts`;

  document.querySelectorAll('thead th[data-sort]').forEach(th=>th.classList.remove('sorted','asc'));
  const [key,dir] = state.sort.split(/_(?=asc|desc)/);
  const th = document.querySelector(`thead th[data-sort="${key}"]`);
  if (th){ th.classList.add('sorted'); if (dir==='asc') th.classList.add('asc'); }
}

render();
</script>
</body>
</html>
